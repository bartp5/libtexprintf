name: Publish npm (Trusted Publishing)

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make

      - name: Build Static Library (emmake)
        shell: bash
        run: |
          sh autogen.sh
          emconfigure ./configure \
          --host=wasm32-unknown-emscripten \
          --disable=shared --disable=tests --disable=examples \
          --disable=demo --disable=main --disable=man \
          --without-include --without-man \
          CFLAGS='-O3' \
          LDFLAGS='-s STANDALONE_WASM=1'
          emmake make
          
      - name: Create WASM
        shell: bash
        run: |
          emcc -O3 -s STANDALONE_WASM=1 \
            -Wl,--no-entry \
            -Wl,--export=texstring \
            -Wl,--export=texerrors_str \
            -Wl,--export=malloc \
            -Wl,--export=free \
            -o libtexprintf.wasm \
            src/.libs/libtexprintf.a

      - name: Run Node tests
        run: |        
         cp libtexprintf.wasm npmjs/libtexprintf.wasm
         node --test npmjs/libtexprintf.test.js

      - name: Prepare npm package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y (example: v1.2)." >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}.0"

          rm -rf npm-dist
          mkdir -p npm-dist

          cp npmjs/libtexprintf.js npm-dist/libtexprintf.js
          cp libtexprintf.wasm npm-dist/libtexprintf.wasm
          cp npmjs/README.md npm-dist/README.md
          cp COPYING npm-dist/LICENSE
          cp npmjs/npm-package.json npm-dist/package.json

          npm --prefix npm-dist version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm (OIDC)
        run: npm publish ./npm-dist --access public --provenance
